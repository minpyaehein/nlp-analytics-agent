name: InsightFlow AI Tests

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  deterministic-tests:
    name: Deterministic Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Compile Python source
        run: |
          python -m compileall app core tests scripts

      - name: Run deterministic tests
        run: |
          python -m pytest -q -ra -m "not ollama"

      - name: Show test environment
        if: always()
        run: |
          python --version
          python -m pip --version
